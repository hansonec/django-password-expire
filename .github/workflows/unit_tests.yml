name: Unit Tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["3.2", "4.2", "5.0", "5.1", "5.2"]
        exclude:
          # Django 3.2 supports Python 3.8-3.10
          - { python-version: "3.11", django-version: "3.2" }
          - { python-version: "3.12", django-version: "3.2" }
          - { python-version: "3.13", django-version: "3.2" }
          # Django 5.x requires Python 3.10+
          - { python-version: "3.8", django-version: "5.0" }
          - { python-version: "3.9", django-version: "5.0" }
          - { python-version: "3.8", django-version: "5.1" }
          - { python-version: "3.9", django-version: "5.1" }
          - { python-version: "3.8", django-version: "5.2" }
          - { python-version: "3.9", django-version: "5.2" }
          # Python 3.13 support added in Django 5.2
          - { python-version: "3.13", django-version: "4.2" }
          - { python-version: "3.13", django-version: "5.0" }
          - { python-version: "3.13", django-version: "5.1" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install humanize "Django~=${{ matrix.django-version }}"

      - name: Run tests
        run: |
          python test.py
